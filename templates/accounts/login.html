{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HomeoCare Login</title>

    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->
    <div class="left-side">

        <!-- Replace this image with your own -->
        <img src="{% static 'images/logimage.png' %}" alt="HomeoCare">

        <div class="overlay"></div>

    </div>


    <!-- Right Side -->
    <div class="right-side">

        <div class="login-card">

            <div class="logo-circle">
                <i class="fa-solid fa-leaf"></i>
            </div>

            <h1>HomeoCare</h1>

            <h2>Welcome to HomeoCare</h2>

            <p class="subtitle">
                Access your healthcare account to manage appointments,
                medical records and consultations.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        name="username"
                        placeholder="Username"
                        required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required>

                </div>

                <div class="forgot-password">

                    <a href="{% url 'forgot_password' %}">
                            Forgot Password?
                    </a>
                </div>

                <button class="login-btn" type="submit">

                    Login

                </button>

            </form>

            {% if error %}

            <div class="error-box">

                <i class="fa-solid fa-circle-exclamation"></i>

                {{ error }}

            </div>

            {% endif %}

            <div class="or-divider">

                <span>OR</span>

            </div>

            <p class="signup-text">

                New to HomeoCare?

                <a href="{% url 'register' %}">
                    Create an Account
                </a>

            </p>

        </div>

    </div>

</div>

</body>

</html>
