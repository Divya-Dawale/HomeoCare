{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HomeoCare Staff Login</title>

    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo-circle">
            <i class="fa-solid fa-leaf"></i>
        </div>

        <h1>HomeoCare</h1>

        <p class="portal">
            Staff Portal
        </p>

        <div class="divider"></div>

        <h3>Welcome Back</h3>

        <p class="subtitle">
            Login to securely access your clinic dashboard.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        {% if error %}
        <div class="error-box">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ error }}
        </div>
        {% endif %}

        <div class="bottom-text">

            <i class="fa-solid fa-shield-heart"></i>

            Secure access for authorized HomeoCare staff only.

        </div>

    </div>

</div>

</body>
</html>
