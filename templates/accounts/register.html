{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Staff Account | HomeoCare</title>

    <link rel="stylesheet" href="{% static 'accounts/register.css' %}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->
    <div class="left-side">

        <img src="{% static 'accounts/images/login-image.png' %}" alt="HomeoCare">

        <div class="overlay"></div>

    </div>

    <!-- Right Side -->
    <div class="right-side">

        <div class="login-card">

            <div class="logo-circle">
                <i class="fa-solid fa-house-medical"></i>
            </div>

            <h1>HomeoCare</h1>

            <h2>Create Staff Account</h2>

            <p class="subtitle">
                Register a Doctor or Receptionist to securely access the HomeoCare system.
            </p>

            <form method="POST">

                {% csrf_token %}

                <!-- Full Name -->
                <div class="input-box">

                    <i class="fa-solid fa-id-card"></i>

                    <input
                        type="text"
                        name="full_name"
                        placeholder="Full Name"
                        required>

                </div>

                <!-- Username -->
                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        name="username"
                        placeholder="Username"
                        required>

                </div>

                <!-- Email -->
                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        name="email"
                        placeholder="Email Address"
                        required>

                </div>

                <!-- Role -->
                <div class="input-box">

                    <i class="fa-solid fa-user-doctor"></i>

                    <select name="role" required>

                        <option value="" selected disabled>
                            Select Staff Role
                        </option>

                        <option value="Doctor">
                            Doctor
                        </option>

                        <option value="Receptionist">
                            Receptionist
                        </option>

                    </select>

                </div>

                <!-- Password -->
                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required>

                </div>

                <!-- Confirm Password -->
                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm Password"
                        required>

                </div>

                <button class="login-btn" type="submit">

                    <i class="fa-solid fa-user-plus"></i>

                    Create Account

                </button>

            </form>

            {% if error %}

            <div class="error-box">

                <i class="fa-solid fa-circle-exclamation"></i>

                {{ error }}

            </div>

            {% endif %}

            <div class="or-divider">

                <span>OR</span>

            </div>

            <p class="signup-text">

                Already have an account?

                <a href="{% url 'staff_login' %}">

                    Login

                </a>

            </p>

        </div>

    </div>

</div>

</body>

</html>
