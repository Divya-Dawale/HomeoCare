{% extends 'doctor/base_doctor.html' %}

{% block page_title %}
Change Password
{% endblock %}

{% block content %}

<div class="settings-card">

    <h2>Change Password</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="save-btn">

            Update Password

        </button>

    </form>

</div>

{% endblock %}
